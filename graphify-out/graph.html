        var network = new vis.Network(container, data, options);
        
        function zoomIn() { network.getCanvas().style.cursor = 'grab'; network.zoom(network.getScale() * 1.2); }

        function fitView() { network.fit(); }
        function togglePhysics() { 
            var phys = network.getPhysics().enabled;
            network.setOptions({physics: {enabled: !phys}});
        }
        
        network.on("stabilizationProgress", function(params) {
            var widthFactor = params.iterations/params.total;
            console.log('Stabilizing: ' + Math.round(widthFactor * 100) + '%');
        });
        network.once("stabilizationIterationsDone", function() {
            network.setOptions({physics: false});
            console.log('Graph stabilized');
