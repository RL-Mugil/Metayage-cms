# Public marketing site: canpatentit.com (static files in /var/www/canpatentit).
# Independent of the IPFlow portal; the enquiry form posts to login.myipstrategy.com/api/public/contact.

server {
    listen 80;
    listen [::]:80;
    server_name canpatentit.com www.canpatentit.com;
    return 301 https://canpatentit.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.canpatentit.com;

    ssl_certificate /etc/letsencrypt/live/canpatentit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canpatentit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://canpatentit.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name canpatentit.com;

    ssl_certificate /etc/letsencrypt/live/canpatentit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canpatentit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/canpatentit-security-headers.conf;

    root /var/www/canpatentit;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    error_page 404 /404.html;

    location = /404.html { internal; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # add_header in a location drops inherited headers, so repeat the shared snippet.
        include snippets/canpatentit-security-headers.conf;
        try_files $uri =404;
    }

    # Admin pages: never indexed, never cached.
    location ~ ^/(login|admin)$ {
        include snippets/canpatentit-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri.html =404;
    }

    # Uploaded article images are named by content hash, so they can be cached for a long time.
    location /insights/img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include snippets/canpatentit-security-headers.conf;
        try_files $uri =404;
    }

    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }

    location / {
        # Clean URLs: /privacy -> privacy.html
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
