# Public marketing site: myipstrategy.com (static files in /var/www/mypl-marketing).
# The app itself lives on login.myipstrategy.com (see nginx-mypl-cms.conf).

server {
    listen 80;
    listen [::]:80;
    server_name myipstrategy.com www.myipstrategy.com;
    return 301 https://myipstrategy.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.myipstrategy.com;

    ssl_certificate /etc/letsencrypt/live/myipstrategy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myipstrategy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://myipstrategy.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myipstrategy.com;

    ssl_certificate /etc/letsencrypt/live/myipstrategy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myipstrategy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/marketing-security-headers.conf;

    root /var/www/mypl-marketing;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    error_page 404 /404.html;

    # Old app URLs that existed on this host before the move to login.myipstrategy.com.
    # 308 keeps the method and body, so installed mobile builds posting to /api still work,
    # and emailed password-reset links keep resolving.
    location ~ ^/(login|logout|forgot-password|reset-password|api|broadcasting|webhooks|sanctum|horizon|app|apps|dashboard|clients|projects|tasks|financial|hrms|settings)(/|$) {
        return 308 https://login.myipstrategy.com$request_uri;
    }

    location = /404.html { internal; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # add_header in a location drops inherited headers, so repeat the shared snippet.
        include snippets/marketing-security-headers.conf;
        try_files $uri =404;
    }

    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }

    location / {
        # Clean URLs: /privacy -> privacy.html
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
