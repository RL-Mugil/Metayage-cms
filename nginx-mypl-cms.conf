server {
    listen 80;
    listen [::]:80;
    server_name myipstrategy.com www.myipstrategy.com;
    return 301 https://myipstrategy.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.myipstrategy.com;

    ssl_certificate /etc/letsencrypt/live/myipstrategy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myipstrategy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://myipstrategy.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myipstrategy.com;

    ssl_certificate /etc/letsencrypt/live/myipstrategy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myipstrategy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/security-headers.conf;

    root /var/www/mypl-cms/backend/public;
    index index.php;

    charset utf-8;
    # X-Frame-Options / X-Content-Type-Options already set (with `always`, and a
    # stricter DENY vs. this file's former SAMEORIGIN) by the included
    # snippets/security-headers.conf above — nginx doesn't dedupe add_header
    # directives, so redefining them here sent two conflicting values per header.

    # ^~ + trailing slash: match only real Reverb/Pusher-protocol paths
    # (/app/{key}, /apps/{app_id}/...), not any page route that merely starts
    # with the same letters. A bare `location /app`/`location /apps` prefix
    # match (no anchor) was swallowing /approvals — Reverb doesn't recognize
    # that path and returns its own bare "Not found.", so the request never
    # reached Laravel at all. See ApprovalController/web.php — unaffected,
    # they were correct all along.
    location ^~ /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8080;
    }

    location ^~ /apps/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm-mypl-cms.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 32 32k;
        fastcgi_buffer_size 64k;
        fastcgi_read_timeout 360;
        fastcgi_send_timeout 300;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known).* { deny all; }
}
